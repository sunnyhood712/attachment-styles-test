<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成人依恋类型测试</title>
<style>
:root {
  --bg: #F7F6F3;
  --card: #FFFFFF;
  --primary: #2D3A4A;
  --accent: #7C8DA5;
  --text: #2D3A4A;
  --text-light: #8E99A8;
  --border: #E2E0DB;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

.header { text-align: center; padding: 60px 0 40px; }
.header h1 { font-size: 28px; font-weight: 600; letter-spacing: 2px; color: var(--primary); margin-bottom: 12px; }
.header .subtitle { font-size: 14px; color: var(--text-light); letter-spacing: 1px; font-weight: 300; }
.header .intro {
  margin-top: 28px; font-size: 14px; color: var(--text-light);
  line-height: 2; max-width: 560px; margin-left: auto; margin-right: auto; text-align: left;
}

.divider { width: 40px; height: 2px; background: var(--accent); margin: 32px auto; border-radius: 1px; }

.progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--border); z-index: 100; }
.progress-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }

.question-block {
  background: var(--card); border-radius: 12px; padding: 32px 28px;
  margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); transition: all 0.2s;
  border-left: 3px solid transparent; /* 预留边框位置，避免点击时抖动 */
}
.question-block.answered { border-left-color: var(--accent); }
.question-number { font-size: 12px; color: var(--text-light); letter-spacing: 1px; margin-bottom: 10px; font-weight: 500; }
.question-text { font-size: 15px; color: var(--text); margin-bottom: 20px; line-height: 1.9; }

.options { display: flex; gap: 8px; flex-wrap: wrap; }

.option-label {
  flex: 1; min-width: 56px; text-align: center; padding: 10px 4px;
  border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
  transition: all 0.2s; font-size: 13px; color: var(--text-light);
  user-select: none; position: relative;
}
.option-label:hover { border-color: var(--accent); color: var(--accent); }
.option-label input { position: absolute; opacity: 0; pointer-events: none; }
.option-label.selected { background: var(--primary); border-color: var(--primary); color: #fff; }
.option-label .opt-num { display: block; font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.option-label .opt-desc { font-size: 11px; opacity: 0.85; }

.submit-area { text-align: center; margin-top: 48px; }
.btn-submit {
  display: inline-block; padding: 16px 64px; background: var(--primary); color: #fff;
  border: none; border-radius: 8px; font-size: 16px; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s; font-family: inherit;
}
.btn-submit:hover { background: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124, 141, 165, 0.3); }
.btn-submit:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; transform: none; box-shadow: none; }
.hint { font-size: 12px; color: var(--text-light); margin-top: 16px; }

.result-section { display: none; animation: fadeUp 0.6s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.result-hero { text-align: center; padding: 48px 0 32px; }
.result-type-tag {
  display: inline-block; padding: 6px 20px; border-radius: 20px;
  font-size: 12px; letter-spacing: 2px; color: #fff; margin-bottom: 16px;
}
.result-hero h2 { font-size: 32px; font-weight: 600; letter-spacing: 3px; color: var(--primary); margin-bottom: 8px; }
.result-hero .result-sub { font-size: 14px; color: var(--text-light); letter-spacing: 1px; }

.chart-container { text-align: center; margin: 40px 0; }
.chart-container canvas { max-width: 360px; width: 100%; }
.chart-labels {
  display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
  margin-top: 16px; font-size: 12px; color: var(--text-light);
}
.chart-labels span::before {
  content: ''; display: inline-block; width: 10px; height: 10px;
  border-radius: 2px; margin-right: 6px; vertical-align: middle;
}

.quadrant-container { text-align: center; margin: 20px 0 12px; padding: 0; }
.quadrant-container canvas { width: 100%; max-width: 600px; height: auto; }

.detail-card {
  background: var(--card); border-radius: 12px; padding: 32px 28px;
  margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.detail-card h3 {
  font-size: 16px; font-weight: 600; color: var(--primary);
  margin-bottom: 16px; letter-spacing: 1px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.detail-card p { font-size: 14px; color: var(--text); line-height: 2; margin-bottom: 14px; }
.detail-card p:last-child { margin-bottom: 0; }

.quote-block {
  padding: 16px 20px; background: #F0EFEC; border-radius: 8px;
  font-size: 13px; color: #5A6577; line-height: 1.9; margin: 16px 0;
  border-left: 3px solid var(--accent);
}
.quote-block .quote-source {
  display: block; text-align: right; font-size: 12px; color: var(--text-light); margin-top: 8px;
}

.score-row { display: flex; align-items: center; margin-bottom: 16px; gap: 12px; }
.score-row .label { width: 80px; font-size: 13px; color: var(--text-light); flex-shrink: 0; }
.score-row .bar-bg { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.score-row .bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
.score-row .score-val { width: 44px; font-size: 13px; color: var(--text-light); text-align: right; flex-shrink: 0; }

.traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trait-item { padding: 16px; background: var(--bg); border-radius: 8px; font-size: 13px; line-height: 1.7; }
.trait-item .trait-title { font-weight: 600; color: var(--primary); margin-bottom: 6px; font-size: 13px; }
.trait-item .trait-desc { color: var(--text-light); font-size: 12px; }

.advice-list { list-style: none; padding: 0; }
.advice-list li {
  padding: 12px 0 12px 20px; border-bottom: 1px solid var(--border);
  font-size: 14px; line-height: 1.8; color: var(--text); position: relative;
}
.advice-list li:last-child { border-bottom: none; }
.advice-list li::before { content: '—'; position: absolute; left: 0; color: var(--accent); }

/* 子维度分析 */
.subdim-group { margin-bottom: 24px; }
.subdim-group:last-child { margin-bottom: 0; }
.subdim-group-title {
  font-size: 13px; font-weight: 600; color: var(--primary);
  margin-bottom: 12px; letter-spacing: 0.5px;
}
.subdim-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.subdim-row .subdim-info { width: 130px; flex-shrink: 0; }
.subdim-row .subdim-name { font-size: 13px; color: var(--text); font-weight: 500; }
.subdim-row .subdim-desc { font-size: 11px; color: var(--text-light); line-height: 1.4; margin-top: 2px; }
.subdim-row .subdim-bar-bg { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.subdim-row .subdim-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
.subdim-row .subdim-val { width: 36px; font-size: 13px; color: var(--text-light); text-align: right; flex-shrink: 0; }

/* 历史记录 */
.history-empty { font-size: 13px; color: var(--text-light); text-align: center; padding: 12px 0; }
.history-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  font-size: 13px; gap: 12px;
}
.history-item:last-child { border-bottom: none; }
.history-item .hist-date { color: var(--text-light); font-size: 12px; width: 100px; flex-shrink: 0; }
.history-item .hist-type {
  padding: 3px 10px; border-radius: 12px; font-size: 12px; color: #fff; flex-shrink: 0;
}
.history-item .hist-score {
  color: var(--text-light); font-size: 12px; text-align: right; margin-left: auto;
}
.history-clear {
  margin-top: 16px; text-align: center;
  font-size: 12px; color: var(--text-light); cursor: pointer;
  text-decoration: underline; text-underline-offset: 4px;
}
.history-clear:hover { color: var(--accent); }

/* 分享卡片 */
.share-canvas-wrap {
  text-align: center;
  margin: 20px 0 16px;
}
.share-canvas-wrap canvas {
  width: 100%; max-width: 400px; height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(45, 58, 74, 0.10);
}
.btn-share {
  display: inline-block; padding: 12px 36px;
  background: var(--primary); color: #fff; border: none;
  border-radius: 8px; font-size: 14px; letter-spacing: 1px;
  cursor: pointer; transition: all 0.3s; font-family: inherit;
  margin-top: 8px;
}
.btn-share:hover { background: var(--accent); transform: translateY(-1px); }
.btn-share.secondary {
  background: transparent; color: var(--text-light);
  border: 1.5px solid var(--border);
}
.btn-share.secondary:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
.share-hint {
  font-size: 12px; color: var(--text-light); margin-top: 12px; text-align: center;
}

.restart-area { text-align: center; margin-top: 48px; }
.btn-restart {
  padding: 12px 40px; background: transparent; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 14px; color: var(--text-light); cursor: pointer;
  transition: all 0.3s; font-family: inherit; letter-spacing: 1px;
}
.btn-restart:hover { border-color: var(--accent); color: var(--accent); }

.disclaimer {
  margin-top: 40px; padding: 20px; background: #F0EFEC; border-radius: 8px;
  font-size: 12px; color: var(--text-light); line-height: 1.8; text-align: center;
}

@media (max-width: 600px) {
  .container { padding: 24px 16px 60px; }
  .header h1 { font-size: 22px; }
  .header { padding: 40px 0 24px; }
  .question-block { padding: 24px 18px; }
  .options { gap: 6px; }
  .option-label { min-width: 44px; padding: 8px 2px; }
  .option-label .opt-desc { display: none; }
  .traits-grid { grid-template-columns: 1fr; }
  .result-hero h2 { font-size: 26px; }
  .score-row .label { width: 60px; font-size: 12px; }
  .subdim-row .subdim-info { width: 100px; }
  .history-item .hist-date { width: 80px; font-size: 11px; }
}
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="container" id="app">

  <div id="introPage">
    <div class="header">
      <h1>依恋类型测试</h1>
      <p class="subtitle">ADULT ATTACHMENT STYLE ASSESSMENT</p>
      <div class="divider"></div>
      <p class="intro">
        本测试基于Bartholomew与Horowitz的成人依恋四类型模型及ECR亲密关系经历量表编制，
        从「依恋焦虑」与「依恋回避」两个维度，帮助你了解自己在人际关系中的依恋倾向。
        依恋是一种贯穿一生的关系模式，它不仅体现在亲密伴侣之间，也体现在你与朋友、家人、
        同事乃至泛泛之交的互动中。共30题，约需6分钟。请根据你在这些情境中的
        <b>真实反应</b>作答，而非你希望自己成为的样子。
      </p>
    </div>
    <div class="submit-area">
      <button class="btn-submit" onclick="startTest()">开始测试</button>
      <p class="hint">本测试仅供自我探索参考，不构成心理诊断</p>
    </div>
  </div>

  <div id="questionPage" style="display:none;"></div>

  <div id="resultPage" class="result-section"></div>

</div>

<script>
// ============ 子维度定义 ============
const SUBDIMENSIONS = {
  // 依恋焦虑的三个侧面
  fear_of_abandonment: {
    name: "害怕被抛弃",
    parent: "anxiety",
    desc: "对被疏远、被遗忘的深层担忧"
  },
  need_for_reassurance: {
    name: "寻求确认",
    parent: "anxiety",
    desc: "需要他人反复表达关心才安心"
  },
  sensitivity_jealousy: {
    name: "过度敏感",
    parent: "anxiety",
    desc: "对细微信号的放大解读与嫉妒"
  },
  // 依恋回避的三个侧面
  emotional_suppression: {
    name: "情感压抑",
    parent: "avoidance",
    desc: "将情绪留给自己消化而非分享"
  },
  intimacy_discomfort: {
    name: "亲密不适",
    parent: "avoidance",
    desc: "对深度亲近的本能退避"
  },
  independence_priority: {
    name: "独立优先",
    parent: "avoidance",
    desc: "自我依靠高于他人依赖"
  }
};

// ============ 题库数据 ============
// 每题标记所属主维度、子维度以及是否反向计分
const QUESTIONS = [
  // ===== 依恋焦虑维度（15题） =====
  { text: "我在意的人，并不一定像我在乎他们那样在乎我。想到这一点，我心里会隐隐不安。", dim: "anxiety", subdim: "fear_of_abandonment", reverse: false },
  { text: "当朋友或同事过了很久都没回我消息时，我会忍不住想，是不是自己哪里做得不对。", dim: "anxiety", subdim: "need_for_reassurance", reverse: false },
  { text: "我需要身边的人时不时地向我确认——他们是真的在乎我、重视我。", dim: "anxiety", subdim: "need_for_reassurance", reverse: false },
  { text: "如果朋友聚会没有叫上我，我会忍不住反复琢磨其中的原因。", dim: "anxiety", subdim: "sensitivity_jealousy", reverse: false },
  { text: "我基本不担心身边的人会疏远我。关系自然地来去，我心里是平静的。", dim: "anxiety", subdim: "fear_of_abandonment", reverse: true },
  { text: "在各种关系里，我常常觉得自己是付出更多、更主动维系的那一方。", dim: "anxiety", subdim: "need_for_reassurance", reverse: false },
  { text: "和亲近的人发生分歧后，我会担心这段关系会不会就此结束。", dim: "anxiety", subdim: "fear_of_abandonment", reverse: false },
  { text: "我需要别人反复向我表达关心，才能确信自己是被在乎的。", dim: "anxiety", subdim: "need_for_reassurance", reverse: false },
  { text: "我害怕一旦别人真正了解我，他们就不会再喜欢真实的我。", dim: "anxiety", subdim: "fear_of_abandonment", reverse: false },
  { text: "当我在意的人把注意力放在别人身上时，我会感到一种说不出的不安。", dim: "anxiety", subdim: "sensitivity_jealousy", reverse: false },
  { text: "我不太在意别人是否及时回应我，也很少因此多想什么。", dim: "anxiety", subdim: "need_for_reassurance", reverse: true },
  { text: "即使是很稳定的友谊，我也会时不时担心对方其实并不那么喜欢我。", dim: "anxiety", subdim: "fear_of_abandonment", reverse: false },
  { text: "我常常留意身边人对我的态度，是否有那些细微的变化。", dim: "anxiety", subdim: "sensitivity_jealousy", reverse: false },
  { text: "与人交往之后，我会反复回想自己说过的话，是不是让别人不舒服了。", dim: "anxiety", subdim: "sensitivity_jealousy", reverse: false },
  { text: "我很少怀疑身边的人对我的感情是否真诚，也不太在意这些。", dim: "anxiety", subdim: "fear_of_abandonment", reverse: true },

  // ===== 依恋回避维度（15题） =====
  { text: "遇到烦心事的时候，我更习惯自己消化，而不是告诉别人。", dim: "avoidance", subdim: "emotional_suppression", reverse: false },
  { text: "当有人想要和我变得很亲近时，我心里会本能地升起一种想要后退的冲动。", dim: "avoidance", subdim: "intimacy_discomfort", reverse: false },
  { text: "我觉得向信任的人倾诉自己的感受，是件很自然的事。", dim: "avoidance", subdim: "emotional_suppression", reverse: true },
  { text: "我会下意识地避免和他人走得太近，保持距离让我更自在。", dim: "avoidance", subdim: "intimacy_discomfort", reverse: false },
  { text: "遇到困难时，向身边的人开口求助对我来说并不难。", dim: "avoidance", subdim: "independence_priority", reverse: true },
  { text: "我更愿意自己扛下所有问题，而不是去麻烦别人。", dim: "avoidance", subdim: "independence_priority", reverse: false },
  { text: "当朋友想和我聊他们内心深处的感受时，我会感到有些不自在。", dim: "avoidance", subdim: "intimacy_discomfort", reverse: false },
  { text: "相比起亲密无间，我更喜欢和别人保持一种不远不近的关系。", dim: "avoidance", subdim: "intimacy_discomfort", reverse: false },
  { text: "我能够坦率地和亲近的人谈论自己的感受，不觉得有什么需要藏着的。", dim: "avoidance", subdim: "emotional_suppression", reverse: true },
  { text: "我很难真正地完全信任一个人，哪怕相处多年也一样。", dim: "avoidance", subdim: "independence_priority", reverse: false },
  { text: "当一段关系变得越来越深入稳定时，我反而会想抽身、想喘口气。", dim: "avoidance", subdim: "intimacy_discomfort", reverse: false },
  { text: "我不习惯在别人面前流露脆弱的一面，更愿意一个人消化情绪。", dim: "avoidance", subdim: "emotional_suppression", reverse: false },
  { text: "与其向别人倾诉烦恼，我更倾向于自己扛着、自己想办法。", dim: "avoidance", subdim: "emotional_suppression", reverse: false },
  { text: "依赖别人对我来说是有风险的，保持自给自足才让我感到真正安全。", dim: "avoidance", subdim: "independence_priority", reverse: false },
  { text: "在人际关系中，我经常需要更多的个人空间，过于频繁的社交会让我感到耗竭。", dim: "avoidance", subdim: "independence_priority", reverse: false }
];

const SHUFFLED = [...QUESTIONS].sort(() => Math.random() - 0.5);

// ============ 四类型定义 ============
const TYPES = {
  secure: {
    name: "安全型",
    en: "Secure",
    color: "#6B9E7A",
    tagColor: "#6B9E7A",
    short: "在亲密中自在，在独立中安心",
    desc: [
      "在感情上很容易接近他人。不管是依赖他人还是被人依赖都感觉心安。不会忧心独处和不为人接纳。这是Bartholomew与Horowitz在1991年提出的四类型模型中，对安全型依恋的原型描述。",
      "安全型依恋的根基，在生命的最初就已经开始铺设。罗兰·米勒在《亲密关系》中这样描述：婴儿哭喊时，慈爱的抚育者总是如约而至，得到此种呵护的婴儿就能舒心地依赖他人，觉得他人可以信任，能从别人那里获得安全和友善。结果，这些儿童就发展出安全型依恋——他们快乐地与他人交往，很容易与他人发展出轻松信任的人际关系。",
      "Robert Karen在《Becoming Attached》中进一步指出，安全型依恋被看作情感健康的来源，它给孩子一种确信——有人会在他需要的时候出现，从而使他拥有与他人建立令人满意的关系的能力。这种确信并不会随着童年结束而消失，也不会仅仅停留在恋爱关系里。安全型的人在与朋友的相处中、在职场的人际往来中、在与家人的联结中，都能保持一种较为稳定的信任与开放。",
      "安全型的人一般对自己和他人都有积极的看法，记忆中的父母也是充满爱心、提供支持的。这不是说安全型的人从未经历过失望或伤害，而是他们拥有一种内在的稳定感，使他们在面对关系中的不确定时，倾向于沟通而非攻击或逃离。",
      "需要特别说明的是，安全型并不是“完美型”。Hazan与Shaver在1987年的调查中发现，约40%的人认为自己不安全——他们要么很难信任和依赖他人，要么十分担心自己的人际关系能否持续。这意味着，不安全依恋是相当普遍的人类经验，而非某种缺陷。"
    ],
    quotes: [
      { text: "安全型的人能更积极快乐地寻求亲密、相互依赖的人际关系。", source: "罗兰·米勒《亲密关系》" },
      { text: "安全型依恋被看作情感健康的来源，它给孩子一种确信——有人会在他需要的时候出现。", source: "Robert Karen, Becoming Attached" }

// ============ 状态 ============
let answers = new Array(SHUFFLED.length).fill(null);
let currentResult = null;

// ============ 渲染题目 ============
function startTest() {
  document.getElementById("introPage").style.display = "none";
  document.getElementById("questionPage").style.display = "block";
  renderQuestions();
}

function renderQuestions() {
  const container = document.getElementById("questionPage");
  let html = "";
  html += '<div class="header" style="padding:20px 0 16px"><h1 style="font-size:20px">人际关系体验问卷</h1>';
  html += '<p class="subtitle">请根据你在这些情境中的真实反应作答</p></div>';

  SHUFFLED.forEach((q, i) => {
    html += `<div class="question-block" id="qb-${i}">`;
    html += `<div class="question-number">第 ${i + 1} 题 / 共 ${SHUFFLED.length} 题</div>`;
    html += `<div class="question-text">${q.text}</div>`;
    html += `<div class="options">`;
    const labels = ["非常不同意", "比较不同意", "有点不同意", "中立", "有点同意", "比较同意", "非常同意"];
    const vals = [1, 2, 3, 4, 5, 6, 7];
    vals.forEach((v, j) => {
      html += `<label class="option-label" id="opt-${i}-${v}" onclick="selectOption(${i},${v})">
        <input type="radio" name="q${i}" value="${v}">
        <span class="opt-num">${v}</span>
        <span class="opt-desc">${labels[j]}</span>
      </label>`;
    });
    html += `</div></div>`;
  });

  html += `<div class="submit-area">
    <button class="btn-submit" id="btnSubmit" disabled onclick="calculateResult()">查看结果</button>
    <p class="hint" id="hintText">请回答所有题目后查看结果</p>
  </div>`;

  container.innerHTML = html;
}

// ============ 选择选项 ============
function selectOption(qIndex, value) {
  answers[qIndex] = value;

  for (let v = 1; v <= 7; v++) {
    const el = document.getElementById(`opt-${qIndex}-${v}`);
    if (el) el.classList.toggle("selected", v === value);
  }

  document.getElementById(`qb-${qIndex}`).classList.add("answered");

  const answered = answers.filter(a => a !== null).length;
  document.getElementById("progressBar").style.width = (answered / SHUFFLED.length * 100) + "%";

  const btn = document.getElementById("btnSubmit");
  if (answered === SHUFFLED.length) {
    btn.disabled = false;
    document.getElementById("hintText").textContent = "已完成所有题目";
  } else {
    document.getElementById("hintText").textContent = `已完成 ${answered}/${SHUFFLED.length} 题`;
  }
}

// ============ 计算得分 ============
function calculateResult() {
  const anxietyItems = [];
  const avoidItems = [];
  // 子维度累加
  const subdimItems = {};
  for (const k in SUBDIMENSIONS) subdimItems[k] = [];

  SHUFFLED.forEach((q, i) => {
    let score = answers[i];
    if (q.reverse) score = 8 - score;
    if (q.dim === "anxiety") anxietyItems.push(score);
    else avoidItems.push(score);
    if (q.subdim) subdimItems[q.subdim].push(score);
  });

  const anxietyAvg = anxietyItems.reduce((a, b) => a + b, 0) / anxietyItems.length;
  const avoidAvg = avoidItems.reduce((a, b) => a + b, 0) / avoidItems.length;

  // 子维度平均分
  const subdimScores = {};
  for (const k in subdimItems) {
    const arr = subdimItems[k];
    subdimScores[k] = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  }

  const highAnxiety = anxietyAvg >= 4.0;
  const highAvoid = avoidAvg >= 4.0;

  let typeKey;
  if (!highAnxiety && !highAvoid) typeKey = "secure";
  else if (highAnxiety && !highAvoid) typeKey = "anxious";
  else if (!highAnxiety && highAvoid) typeKey = "avoidant";
  else typeKey = "fearful";

  // 保存本次结果供分享卡片使用
  currentResult = {
    typeKey,
    anxietyAvg,
    avoidAvg,
    subdimScores,
    date: new Date().toISOString()
  };

  // 保存到历史记录
  saveToHistory(currentResult);

  showResult(typeKey, anxietyAvg, avoidAvg, subdimScores);
}

// ============ 六边形雷达图 ============
function drawRadar(typeKey, anxietyAvg, avoidAvg, safeScore) {
  const canvas = document.getElementById("radarCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = 600, H = 600;
  const cx = W / 2, cy = H / 2 + 10;
  const R = 200;
  const levels = 5;

  ctx.clearRect(0, 0, W, H);

  const values = [
    anxietyAvg / 7,
    avoidAvg / 7,
    safeScore / 7,
    1 - (anxietyAvg + avoidAvg) / 14,
    1 - avoidAvg / 9,
    1 - anxietyAvg / 9
  ].map(v => Math.max(0.05, Math.min(1, v)));

  const labels = ["依恋焦虑", "依恋回避", "安全倾向", "关系信任", "情感表达", "自我价值感"];
  const colors = ["#D4915D", "#5B7FA5", "#6B9E7A", "#9B6B7A", "#7C8DA5", "#B8A06B"];
  const N = 6;

  for (let l = levels; l >= 1; l--) {
    const r = R * l / levels;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const angle = (Math.PI * 2 / N) * i - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = l === levels ? "#C8C5BE" : "#E2E0DB";
    ctx.lineWidth = l === levels ? 1.5 : 0.8;
    ctx.stroke();
  }

  for (let i = 0; i < N; i++) {
    const angle = (Math.PI * 2 / N) * i - Math.PI / 2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#E2E0DB";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const angle = (Math.PI * 2 / N) * i - Math.PI / 2;
    const r = R * values[i];
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(124, 141, 165, 0.15)";
  ctx.fill();
  ctx.strokeStyle = "#7C8DA5";
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < N; i++) {
    const angle = (Math.PI * 2 / N) * i - Math.PI / 2;
    const r = R * values[i];
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.font = "500 16px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i = 0; i < N; i++) {
    const angle = (Math.PI * 2 / N) * i - Math.PI / 2;
    const labelR = R + 44;
    const x = cx + labelR * Math.cos(angle);
    const y = cy + labelR * Math.sin(angle);
    ctx.fillStyle = colors[i];
    ctx.fillText(labels[i], x, y);
  }

  ctx.font = "600 20px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#2D3A4A";
  ctx.fillText(TYPES[typeKey].name, cx, cy - 8);
  ctx.font = "300 13px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#8E99A8";
  ctx.fillText("焦虑 " + anxietyAvg.toFixed(1) + " · 回避 " + avoidAvg.toFixed(1), cx, cy + 16);
}

// ============ 四象限图 ============
function drawQuadrant(typeKey, anxietyAvg, avoidAvg) {
  const canvas = document.getElementById("quadrantCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  
  const W = 900, H = 900;
  const left = 130, right = 80, top = 80, bottom = 120;
  const plotW = W - left - right;
  const plotH = H - top - bottom;
  const maxVal = 7;
  const threshold = 4.0;

  ctx.clearRect(0, 0, W, H);

  const toX = (a) => left + (a / maxVal) * plotW;
  const toY = (v) => top + plotH - (v / maxVal) * plotH;

  const quadrants = [
    {
      x: left, y: toY(threshold),
      w: toX(threshold) - left, h: toY(0) - toY(threshold),
      fill: "rgba(107, 158, 122, 0.10)", name: "安全型", desc: "低焦虑 · 低回避",
      lc: "#6B9E7A", anchorX: left + plotW * 0.08, anchorY: toY(0) - plotH * 0.08, align: "left"
    },
    {
      x: toX(threshold), y: toY(threshold),
      w: toX(maxVal) - toX(threshold), h: toY(0) - toY(threshold),
      fill: "rgba(212, 145, 93, 0.10)", name: "焦虑型", desc: "高焦虑 · 低回避",
      lc: "#D4915D", anchorX: left + plotW * 0.92, anchorY: toY(0) - plotH * 0.08, align: "right"
    },
    {
      x: left, y: top,
      w: toX(threshold) - left, h: toY(threshold) - top,
      fill: "rgba(91, 127, 165, 0.10)", name: "回避型", desc: "低焦虑 · 高回避",
      lc: "#5B7FA5", anchorX: left + plotW * 0.08, anchorY: top + plotH * 0.08, align: "left"
    },
    {
      x: toX(threshold), y: top,
      w: toX(maxVal) - toX(threshold), h: toY(threshold) - top,
      fill: "rgba(155, 107, 122, 0.10)", name: "恐惧型", desc: "高焦虑 · 高回避",
      lc: "#9B6B7A", anchorX: left + plotW * 0.92, anchorY: top + plotH * 0.08, align: "right"
    }
  ];

  quadrants.forEach(q => {
    ctx.fillStyle = q.fill;
    ctx.fillRect(q.x, q.y, q.w, q.h);
  });

  ctx.strokeStyle = "#C8C5BE";
  ctx.lineWidth = 2;
  ctx.strokeRect(left, top, plotW, plotH);

  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = "#B0AEA8";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(toX(threshold), top);
  ctx.lineTo(toX(threshold), top + plotH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(left, toY(threshold));
  ctx.lineTo(left + plotW, toY(threshold));
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.font = "500 16px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#8E99A8";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let i = 0; i <= maxVal; i++) {
    ctx.fillText(i.toString(), toX(i), top + plotH + 12);
  }
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let i = 0; i <= maxVal; i++) {
    ctx.fillText(i.toString(), left - 12, toY(i));
  }

  ctx.font = "600 20px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#2D3A4A";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText("依恋焦虑 →", left + plotW / 2, top + plotH + 45);

  ctx.save();
  ctx.translate(left - 75, top + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillText("依恋回避 →", 0, 0);
  ctx.restore();

  quadrants.forEach(q => {
    ctx.textAlign = q.align;
    ctx.textBaseline = "middle";
    ctx.font = "600 24px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = q.lc;
    ctx.fillText(q.name, q.anchorX, q.anchorY - 16);
    ctx.font = "400 16px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = "#8E99A8";
    ctx.fillText(q.desc, q.anchorX, q.anchorY + 16);
  });

  const px = toX(anxietyAvg);
  const py = toY(avoidAvg);

  ctx.beginPath();
  ctx.arc(px, py, 30, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(124, 141, 165, 0.15)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(px, py, 18, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(124, 141, 165, 0.45)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(px, py, 11, 0, Math.PI * 2);
  ctx.fillStyle = "#2D3A4A";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.stroke();

  let labelX = px + 30;
  let labelAlign = "left";
  if (px > W - 250) {
    labelX = px - 30;
    labelAlign = "right";
  }
  let labelY = py - 30;
  if (py < top + 60) labelY = py + 40;

  ctx.textAlign = labelAlign;
  ctx.textBaseline = "middle";
  ctx.font = "600 18px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#2D3A4A";
  ctx.fillText("你的位置", labelX, labelY);
  ctx.font = "500 15px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#8E99A8";
  ctx.fillText(`焦虑 ${anxietyAvg.toFixed(1)} · 回避 ${avoidAvg.toFixed(1)}`, labelX, labelY + 24);
}

// ============ 分享卡片绘制 ============
function drawShareCard(typeKey, anxietyAvg, avoidAvg) {
  const canvas = document.getElementById("shareCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = 750, H = 1050;
  const t = TYPES[typeKey];

  // 背景
  ctx.fillStyle = "#F7F6F3";
  ctx.fillRect(0, 0, W, H);

  // 顶部装饰条
  ctx.fillStyle = t.tagColor;
  ctx.fillRect(0, 0, W, 8);

  // 顶部小标题
  ctx.font = "400 22px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#8E99A8";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText("成人依恋类型测试", W / 2, 60);

  // 日期
  const d = new Date();
  const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  ctx.font = "300 18px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#B0AEA8";
  ctx.fillText(dateStr, W / 2, 96);

  // 类型标签（颜色胶囊）
  ctx.font = "400 20px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  const enText = t.en;
  const enWidth = ctx.measureText(enText).width + 44;
  const tagX = (W - enWidth) / 2;
  const tagY = 165;
  const tagH = 40;
  ctx.fillStyle = t.tagColor;
  roundRect(ctx, tagX, tagY, enWidth, tagH, 20);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(enText, W / 2, tagY + tagH / 2);

  // 类型名（大）
  ctx.font = "700 76px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#2D3A4A";
  ctx.textBaseline = "top";
  ctx.fillText(t.name, W / 2, 245);

  // 类型简短描述
  ctx.font = "400 22px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#8E99A8";
  ctx.textBaseline = "top";
  ctx.fillText(t.short, W / 2, 360);

  // 分隔线
  ctx.strokeStyle = "#E2E0DB";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(120, 430);
  ctx.lineTo(W - 120, 430);
  ctx.stroke();

  // 两个主维度得分
  const barX = 200;
  const barW = 370;
  const barH = 14;
  const barR = 7;

  // 焦虑
  ctx.font = "500 20px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#2D3A4A";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("依恋焦虑", 100, 495);

  ctx.fillStyle = "#E2E0DB";
  roundRect(ctx, barX, 488, barW, barH, barR);
  ctx.fill();
  ctx.fillStyle = "#D4915D";
  roundRect(ctx, barX, 488, Math.max(barW * anxietyAvg / 7, barH), barH, barR);
  ctx.fill();

  ctx.font = "600 22px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#D4915D";
  ctx.textAlign = "right";
  ctx.fillText(anxietyAvg.toFixed(1), W - 100, 495);

  // 回避
  ctx.font = "500 20px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#2D3A4A";
  ctx.textAlign = "left";
  ctx.fillText("依恋回避", 100, 565);

  ctx.fillStyle = "#E2E0DB";
  roundRect(ctx, barX, 558, barW, barH, barR);
  ctx.fill();
  ctx.fillStyle = "#5B7FA5";
  roundRect(ctx, barX, 558, Math.max(barW * avoidAvg / 7, barH), barH, barR);
  ctx.fill();

  ctx.font = "600 22px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#5B7FA5";
  ctx.textAlign = "right";
  ctx.fillText(avoidAvg.toFixed(1), W - 100, 565);

  // 简短类型描述（复制类型名字下面的描述）
  ctx.font = "400 20px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#5A6577";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  const descText = getShortDesc(typeKey);
  wrapText(ctx, descText, 100, 660, W - 200, 32);

  // 底部信息
  ctx.strokeStyle = "#E2E0DB";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(120, H - 130);
  ctx.lineTo(W - 120, H - 130);
  ctx.stroke();

  ctx.font = "400 16px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#B0AEA8";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText("基于 Bartholomew & Horowitz 成人依恋四类型模型", W / 2, H - 110);
  ctx.fillText("仅供自我探索 · 不构成心理诊断", W / 2, H - 80);
}

function getShortDesc(typeKey) {
  const descs = {
    secure: "你在亲密关系中拥有一种难得的从容。既能安心地亲近他人，也能保持清晰的自我边界；既不过度担忧被抛弃，也不排斥深入的联结。",
    anxious: "你对亲密关系有着深切的渴望，愿意为爱全情投入，但常常被一种挥之不去的担忧所困扰——担心他人没有自己爱得那么深，担心终会离开。",
    avoidant: "你高度重视独立与自我空间，对过度的亲密会本能地感到不适。这并非不在乎，而是一种曾经的自我保护——当表达需求不再安全，人学会将情感收回。",
    fearful: "你的内心住着两种彼此拉扯的力量：一种是对亲密的深切渴望，另一种是对亲密的深切恐惧。你在靠近与远离之间反复摇摆——想要被爱，又害怕受伤。"
  };
  return descs[typeKey] || "";
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split("");
  let line = "";
  let currentY = y;
  for (let i = 0; i < chars.length; i++) {
    const testLine = line + chars[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line !== "") {
      ctx.fillText(line, x, currentY);
      line = chars[i];
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  if (line) ctx.fillText(line, x, currentY);
}

// ============ 下载分享卡片 ============
function downloadShareCard() {
  const canvas = document.getElementById("shareCanvas");
  if (!canvas) return;
  try {
    const link = document.createElement("a");
    const d = new Date();
    const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    link.download = `依恋类型测试_${currentResult ? TYPES[currentResult.typeKey].name : '结果'}_${dateStr}.png`;
    link.href = canvas.toDataURL("image/png");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (e) {
    alert("图片下载失败，你可以长按图片保存到相册。");
    console.warn(e);
  }
}

// ============ 历史记录管理 ============
const HISTORY_KEY = "attachment_test_history_v1";

function saveToHistory(result) {
  try {
    const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    history.unshift({
      date: result.date,
      typeKey: result.typeKey,
      anxiety: result.anxietyAvg,
      avoidance: result.avoidAvg
    });
    // 保留最近 10 次
    const trimmed = history.slice(0, 10);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
  } catch (e) {
    console.warn("无法保存历史记录", e);
  }
}

function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function renderHistory() {
  const container = document.getElementById("historyContainer");
  if (!container) return;

  const history = loadHistory();
  if (history.length === 0) {
    container.innerHTML = '<div class="history-empty">暂无历史记录</div>';
    return;
  }

  let html = "";
  history.forEach((item, idx) => {
    const t = TYPES[item.typeKey];
    const d = new Date(item.date);
    const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const isLatest = idx === 0;
    html += `<div class="history-item">
      <span class="hist-date">${dateStr} ${timeStr}${isLatest ? ' · 本次' : ''}</span>
      <span class="hist-type" style="background:${t.tagColor}">${t.name}</span>
      <span class="hist-score">焦虑 ${item.anxiety.toFixed(1)} · 回避 ${item.avoidance.toFixed(1)}</span>
    </div>`;
  });
  html += '<div class="history-clear" onclick="clearHistory()">清空历史记录</div>';
  container.innerHTML = html;
}

function clearHistory() {
  if (!confirm("确定要清空所有历史记录吗？此操作不可撤销。")) return;
  try {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  } catch (e) {
    console.warn(e);
  }
}
